# Hardware, orbit and acquisition definitions. Shared by simulation configs.
# Antenna La/Le and spacings are metres; Na/Ne count INTERNAL elements.
# One complete Rx object is replicated at OceanSAR's num_ch phase centres.
[sar]
# Antenna internals are independent of OceanSAR channel count/positions.
tx_antenna=tx_ant
rx_antenna=rx_ant
f0=5.4e9
# auto uses the orbit-derived ground speed; a numeric override is m/s
v_ground=auto
# Heading Eat of North
heading=-11.2
num_ch=1
b_ati=0
b_xti=0
use_errors=False
sigma_n_tx=0.12
phase_n_tx=2.3
sigma_beta_tx=0.2
phase_beta_tx=0.2
sigma_n_rx=0.04
phase_n_rx=0.2
sigma_beta_rx=0.04
phase_beta_rx=0.2

# DRAMA antenna sections. La/Le are metres; Na/Ne count INTERNAL elements.
# wa_tx/wa_rx: 1 is uniform; e.g. 0.85 applies a raised-cosine taper.
# element_pattern may reference another section or a list of sub-arrays.
# az_offset is local to this antenna origin; b_ati/b_xti translate channels.

[tx_ant]
type_a=phased_array
type_e=phased_array
La=40
Le=1
Na=20
Ne=1
tilt=0
wa_tx=1
we_tx=1

[rx_ant]
type_a=phased_array
type_e=phased_array
La=40
Le=1
Na=20
Ne=1
tilt=0
wa_rx=1
we_rx=1

# DRAMA mode library: these incidence limits NEVER determine ocean Lx/Ly.
# Time-dependent steering is currently unsupported; elevation is not applied.
# PRF, proc_bw, pulse_bw and burst_length are Hz, Hz, Hz and seconds.

[orbit]
# desired orbit height [m]
Horb = 693e3 # 650e3 #
# desired days per cycle [d]
days_cycle = 12 #11  #
# number of orbits for repeat
orbits_nbr = 175 #162  #
omega_p = 83.19
# right ascension of ascending node [deg]
asc_node = 45.82
# fraction of an orbit period
starttime = 3.
# orbit calculation time [d]
timeduration = 12
# Time step [s]
timestep = 10.
ltan = 2017-12-20T18:00:00
# mean anomaly in degrees at epoch
mean_anomaly = 276.9507
epoch = 2021-02-05T08:15:38.615

# Example stripmap mode. All per-subswath acquisition settings have ONE source.
# This library never sets ocean scene size or surface grid spacing.
[SM]
mode=stripmap
inc_angle=[30.]
inc_near=[29]
inc_far=[32]
pol=vv
PRF=[450.]
pulse_bw=[50e6]
over_fs=1.1
burst_length=[1]
proc_bw=[350.]
proc_tapering=0.8
pulse_length=[0.00004]
steering_rate=0
squint=0
short_name=SM
