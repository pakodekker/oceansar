
# This is an example parameter file needed by some example
# code or some higher level functions.
[sim]
# path=/data1/yyuan6/sim_data/RL_sim_out_big
path=/Users/paco/LocalDATA/OceanSAR/RL_scansar_U5_0_T1_0_SW1_30_10km_nopt
# Set to an integer for repeatable random realizations, or None otherwise.
seed=None
# Budget for caller + isolated simulator worker, in GiB; 0/None disables.
# Actual memory is monitored; stages stop at 95% to leave headroom.
memory_limit_gib=12
# Activate individual simulation steps. Useful mostly to reprocess data
# without the slow generation of raw data.
raw_run=False
proc_run=True
insar_run=True
ati_run=True
L2_wavespectrum_run=True
# The next can be just left unchanged
# Ideal, uncalibrated raw samples; system errors are applied before focusing.
raw_file=raw_data.nc
sys_raw_file=raw_data_sys.nc
# The system raw file is deleted after successful focusing.
ocean_file=ocean.nc
ocean_reuse=False
proc_file=proc_data.nc
# Estimate Doppler centroid from the focused complex SLC
do_dc=True
dc_file=dc_data.nc
ati_map_file=ati_maps.nc
insar_file=insar_l1b.nc
ati_file=ati_data.txt
ati_npz_file=ati_data.npz
xspectra_file=xspectra.nc
# nworkers for parallel processing, for example in scipy fft library.
# and for numba
nworkers = 6
corar_run=False
# If True, simulator adds a 3x3 array of point targets
add_point_target=False
verbosity = 2

[system]
# Relative to this main configuration file.
file=systems/rosel.cfg

[mode]
# Acquisition settings live in the system definition; scene size stays below.
definition=RWV
subswath=0

[ocean]
# Scene size
Lx=10e3
Ly=10e3
# Grid spacing
dx=2
dy=2
opt_res=True
dt=0.05
depth=1000
# Wind direction with respect to cross-track. So 0 is wind 
# blowing from near to far range
wind_dir=0.
wind_U=5.
wind_fetch=500e3
# directional swell parameters
swell_dir_enable=True
# spread in frequency
sigf=0.007
freq_r= .068
dir_swell_dir=30
# spread in direction (degrees)
sigs=8
Hs=1.
swell_enable=False
swell_wl=80
swell_dir=45
swell_ampl=0.5
spec_model=elfouhaily
spread_model=elfouhaily
cutoff_wl=auto
current_mag=1
current_dir=0.
fft_max_prime=3
choppy_enable=True
frozen_ocean=False
# Use buoy data instead of theoretical model
use_buoy_data=False
# If true then the rest will be read
buoy_data_file=/Users/plopezdekker/DATA/OCEANSAR/BuouyData/spectra_20141125.npz
year=2014
month=11
day=25
# To be clarified if these are UTC or local
hour=18
minute=34


[srg]
# Factorized ScanSAR: extra COARSE time samples per side (default 8).
# Adds 2*N samples before fast-FFT padding; generated data are then cropped
# back to the requested burst. These are not full-PRF pulses or image pixels.
# More guards reduce FFT-interpolation boundary errors but cost time/memory.
# The coarse sampling rate and retained burst pulse count are unchanged.
# Nonnegative integer; ignored for stripmap and when factorize=False.
scansar_guard_coarse_samples=8
# Remove/restore known current phase and range drift in factorized references.
# False reproduces the platform-only reference for controlled comparisons.
factorize_current=True
# Configuration of raw-data generation
# To speed up simulation with some slight approximation.
factorize = True
# Include hydrodynamic modulation term
use_hmtf=True
nesz=-30.
wh_tol=5.
# Specular scattering, relevant for steep incident angles
scat_spec_enable=False
scat_spec_mode=spa
# Bragg term, set to False if interested only in point-targets
scat_bragg_enable=True
scat_bragg_model=romeiser97
scat_bragg_spec=elfouhaily
scat_bragg_spread=elfouhaily
scat_bragg_d=0.125
use_lut = True

[processing]
# ScanSAR output uses min(ocean.Ly, mode image_length) by default.
# True retains the full mode image_length for a shorter scene, exposing
# regions without scene returns (receiver noise and filter sidelobes).
# image_length is in metres in the selected mode definition, not here.
# Ignored for stripmap. Output samples use the raw header az_sampling.
scansar_full_image=False
# Focusing uses scipy.fft with sim.nworkers threads and mixed-factor FFT
# sizes from next_fast_len, rather than rounding to powers of two.
# Nominal filter support Nh=ceil(az_sampling*B/min(abs(Ka))) samples:
# ScanSAR B=az_sampling; stripmap B=min(processed bandwidth,az_sampling).
# Azimuth FFT covers raw samples + Nh - 1, and the requested output.
# Optional exact FFT length for diagnostics; None selects the fast default.
azimuth_fft_size=None
# Divide out the azimuth antenna field pattern; False keeps acquisition weighting.
# The actual choice is recorded in SLC metadata for DC response correction.
antenna_equalization=True
# Suppress near-null bins when dividing by the complex antenna field.
antenna_min_relative_field=0.001
range_dependent_azimuth=True
reramp=False
plot_format=png
plot_tex=False
plot_save=True
plot_path=processing_plots/
plot_raw=False
plot_rcmc_dopp=False
plot_rcmc_time=False
plot_image_valid=True

[insar]
# Target effective resolution in metres: azimuth, ground range
# ATI inherits this averaging; sample counts are derived from SLC geometry.
resolution=[2000, 2000]
# Multi look window: hanning, hamming, flat
ml_win=hanning
flatten=True
plot_save=True
plot_path=ati_plots/
plot_format=png
plot_tex=False
plot_surface=True
plot_proc_ampl=True
plot_coh=True
plot_coh_all=True


[dc]
# Nominal unequalized acquisition CRB (ScanSAR); optimal-estimator floor.
crlb=True
# None: speckle limit. Otherwise peak antenna signal PSD / noise PSD in dB.
# This is a model input, not an SNR inferred from NESZ or the equalized SLC.
crlb_snr_db=None
# ADPM response correction is applied only in ScanSAR mode; raw DC is retained.
scansar_correction=True
correction_min_sensitivity=0.01
correction_min_correlation=0.05
# Local antenna-spectrum shift interval around zero (Hz).
correction_max_shift_hz=50
# Effective resolution in metres: azimuth, ground range
resolution=[2000, 2000]
taper=hann
# Output samples per effective resolution; 2 is the previous spacing.
# Increase to 4 or 8 for denser sampling at the same averaging resolution.
samples_per_resolution=4
# all processes every single channel independently; or set a zero-based index.
channel=all
lag=1
min_pairs=10
min_correlation=0.05
plot_save=True
plot_path=dc_plots/

[ati]
# Multilook resolution and window are inherited from [insar].
# Multi look window: hanning, hamming, flat
ml_win=hanning
plot_save=True
plot_path=ati_plots/
plot_format=png
plot_tex=False
plot_surface=True
plot_proc_ampl=True
plot_coh=True
plot_coh_all=True
plot_ati_phase=True
plot_ati_phase_all=True
plot_vel_hist=True
plot_vel=False

[L2_wavespectrum]
# Multilook to remove speckle, consider here that we are giving up resolution
# Thus 3 azimuth looks with 3 sublooks doesn't do anything!
rg_ml=1
az_ml=1
# Smoothing of cross spectra
krg_ml = 3
kaz_ml = 3
# Multi look window: hanning, hamming, flat
ml_win=hanning
plot_save=True
plot_path=L2_spec_plots
plot_format=png
plot_tex=False
plot_surface=True
plot_proc_ampl=True
plot_spectrum=True
n_sublook = 3
sublook_az_weighting=1

